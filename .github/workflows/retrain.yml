# retrain.yml — WEEKLY drift/staleness watchdog.
#
# Runs `pipeline.py retrain --region <r>`: check drift (drift.py) + champion age
# for one region, retrain only if it drifted or its champion is stale. One job
# per region via matrix strategy — they run in parallel, so one region's slow
# training can't stack onto another's and blow a single job's timeout.

name: retrain

on:
  schedule:
    - cron: "0 2 * * 0"      # Sunday 02:00 UTC (0 = Sunday). Weekly.
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  retrain:
    strategy:
      fail-fast: false         # one region's failure shouldn't cancel the others
      matrix:
        region: [CAL, TEX, PJM, MISO]
    runs-on: ubuntu-latest
    timeout-minutes: 120       # transformer+lstm training runs ~55-60min per region on free CPU runners
    env:
      EIA_API_KEY:           ${{ secrets.EIA_API_KEY }}
      DAGSHUB_REPO_OWNER:    ${{ secrets.DAGSHUB_REPO_OWNER }}
      DAGSHUB_REPO_NAME:     ${{ secrets.DAGSHUB_REPO_NAME }}
      DAGSHUB_TOKEN:         ${{ secrets.DAGSHUB_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ secrets.AWS_DEFAULT_REGION }}
      S3_BUCKET:             ${{ secrets.S3_BUCKET }}
      PYTHONUNBUFFERED:      "1"  # stream logs live instead of batching in ~4KB chunks
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run retrain pipeline
        run: uv run python src/pipeline.py retrain --region ${{ matrix.region }}
