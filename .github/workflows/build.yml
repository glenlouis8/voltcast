# build.yml — MANUAL full rebuild.
#
# Runs `pipeline.py build --region <r>`: download 5 years, train the Transformer and
# the LSTM, crown the champion in DagsHub, make the first forecast. One job per
# region via matrix strategy — they run in parallel, so 8 trainings don't have to
# squeeze into one job's time limit.
#
# No schedule on purpose — you only rebuild from scratch when you wipe DagsHub
# or change the model architecture. Trigger it by hand from the Actions tab.

name: build

on:
  workflow_dispatch: {}        # manual only — no cron

jobs:
  build:
    strategy:
      fail-fast: false         # one region's failure shouldn't cancel the others
      matrix:
        region: [CAL, TEX, PJM, MISO]
    runs-on: ubuntu-latest
    timeout-minutes: 180       # 5-year download + 2 trainings on a free CPU runner
    env:
      EIA_API_KEY:           ${{ secrets.EIA_API_KEY }}
      DAGSHUB_REPO_OWNER:    ${{ secrets.DAGSHUB_REPO_OWNER }}
      DAGSHUB_REPO_NAME:     ${{ secrets.DAGSHUB_REPO_NAME }}
      DAGSHUB_TOKEN:         ${{ secrets.DAGSHUB_TOKEN }}
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ secrets.AWS_DEFAULT_REGION }}
      S3_BUCKET:             ${{ secrets.S3_BUCKET }}
      PYTHONUNBUFFERED:      "1"  # stream logs live instead of batching them
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run build pipeline for one region
        run: uv run python src/pipeline.py build --region ${{ matrix.region }}
